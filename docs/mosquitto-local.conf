# Local dev broker for testing the touchscreen client.
#
# Run:  mosquitto -c docs/mosquitto-local.conf
#
# Exposes both a normal MQTT listener (for mosquitto_pub/sub, e.g. the mock
# publisher) and a websocket listener (for the browser) on the same broker,
# per Mosquitto's documented pattern for serving both transports at once:
# https://mosquitto.org/man/mosquitto-conf-5.html
#
# Not for production/on-hardware use — no auth, no TLS. The real bridge
# broker config is out of scope for this repo.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
