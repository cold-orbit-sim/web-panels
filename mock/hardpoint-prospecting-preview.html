<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Prospecting Suite — Preview</title>
<style>
:root { --bg:#06090b; --panel:#0d1418; --border:#1f2e33; --text:#d8e6e8; --dim:#5c7378; --amber:#ffb000; --green:#3ddc71; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:ui-monospace,monospace; padding:24px; }
h1 { color:var(--amber); letter-spacing:.22em; font-size:16px; margin-bottom:16px; }
.row { display:flex; gap:24px; flex-wrap:wrap; }
.card { background:var(--panel); border:1px solid var(--border); padding:16px; width:220px; }
.label { color:var(--dim); font-size:11px; letter-spacing:.14em; margin-bottom:8px; }
@keyframes bpulse { 0%,100%{stroke-width:2.5;opacity:.9} 50%{stroke-width:6;opacity:.4} }
.scanning-beam { animation: bpulse 0.7s ease-in-out infinite; }
</style></head><body>
<h1>HARDPOINT MODULE — PROSPECTING SUITE</h1>
<p style="color:var(--dim);font-size:11px;letter-spacing:.12em;margin-bottom:20px;">Two-axis gimbal sensor head. SK5=SCAN, SK6=ORE◀, SK7=ORE▶. Enc A=AIM-X, Enc B=AIM-Y.</p>
<div class="row">

<div class="card">
  <div class="label">READY — MOCK: Carbonite</div>
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:100%">
    <!-- Mount -->
    <rect x="70" y="170" width="60" height="25" rx="2" fill="none" stroke="#ffb000" stroke-width="1.5"/>
    <!-- Y-axis ring -->
    <ellipse cx="100" cy="130" rx="60" ry="20" fill="none" stroke="#ffb000" stroke-width="1.6"/>
    <!-- X-axis ring -->
    <ellipse cx="100" cy="130" rx="18" ry="48" fill="none" stroke="#ffb000" stroke-width="1.4"/>
    <!-- Gimbal arm -->
    <line x1="100" y1="155" x2="100" y2="170" stroke="#ffb000" stroke-width="1.8"/>
    <!-- Axis pivots -->
    <line x1="40" y1="130" x2="26" y2="130" stroke="#ffb000" stroke-width="1" opacity="0.5"/>
    <line x1="160" y1="130" x2="174" y2="130" stroke="#ffb000" stroke-width="1" opacity="0.5"/>
    <circle cx="26" cy="130" r="3.5" fill="none" stroke="#ffb000" stroke-width="1"/>
    <circle cx="174" cy="130" r="3.5" fill="none" stroke="#ffb000" stroke-width="1"/>
    <!-- Sensor head -->
    <circle cx="100" cy="130" r="10" fill="none" stroke="#ffb000" stroke-width="1.8"/>
    <circle cx="100" cy="130" r="4" fill="#ffb000" opacity="0.65"/>
    <!-- Beam (dim = ready) -->
    <line x1="100" y1="120" x2="100" y2="10" stroke="#ffb000" stroke-width="2.5" opacity="0.55"/>
    <line x1="100" y1="120" x2="90" y2="10" stroke="#ffb000" stroke-width="0.8" opacity="0.25"/>
    <line x1="100" y1="120" x2="110" y2="10" stroke="#ffb000" stroke-width="0.8" opacity="0.25"/>
    <!-- Status -->
    <text x="100" y="58" text-anchor="middle" fill="#ffb000" font-size="9" font-family="monospace" letter-spacing="2">MOCK: CARBONITE</text>
    <text x="100" y="74" text-anchor="middle" fill="#5c7378" font-size="9" font-family="monospace" letter-spacing="2">READY</text>
    <circle cx="16" cy="14" r="4" fill="#3ddc71"/>
  </svg>
</div>

<div class="card">
  <div class="label">SCANNING — MOCK: Rare Earth</div>
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:100%">
    <rect x="70" y="170" width="60" height="25" rx="2" fill="none" stroke="#ffb000" stroke-width="1.5"/>
    <ellipse cx="100" cy="130" rx="60" ry="20" fill="none" stroke="#ffb000" stroke-width="1.6"/>
    <ellipse cx="100" cy="130" rx="18" ry="48" fill="none" stroke="#ffb000" stroke-width="1.4"/>
    <line x1="100" y1="155" x2="100" y2="170" stroke="#ffb000" stroke-width="1.8"/>
    <line x1="40" y1="130" x2="26" y2="130" stroke="#ffb000" stroke-width="1" opacity="0.5"/>
    <line x1="160" y1="130" x2="174" y2="130" stroke="#ffb000" stroke-width="1" opacity="0.5"/>
    <circle cx="26" cy="130" r="3.5" fill="none" stroke="#ffb000" stroke-width="1"/>
    <circle cx="174" cy="130" r="3.5" fill="none" stroke="#ffb000" stroke-width="1"/>
    <circle cx="100" cy="130" r="10" fill="none" stroke="#ffb000" stroke-width="1.8"/>
    <circle cx="100" cy="130" r="4" fill="#ffb000" opacity="0.65"/>
    <!-- Pulsing beam -->
    <line class="scanning-beam" x1="100" y1="120" x2="100" y2="10" stroke="#ffb000" stroke-width="2.5"/>
    <line x1="100" y1="120" x2="90" y2="10" stroke="#ffb000" stroke-width="0.8" opacity="0.3"/>
    <line x1="100" y1="120" x2="110" y2="10" stroke="#ffb000" stroke-width="0.8" opacity="0.3"/>
    <text x="100" y="58" text-anchor="middle" fill="#ffb000" font-size="9" font-family="monospace" letter-spacing="2">MOCK: RARE EARTH</text>
    <text x="100" y="74" text-anchor="middle" fill="#ffb000" font-size="9" font-family="monospace" letter-spacing="2" opacity=".8">SCANNING</text>
    <circle cx="16" cy="14" r="4" fill="#3ddc71"/>
  </svg>
</div>

</div>
<p style="color:var(--dim);font-size:10px;letter-spacing:.12em;margin-top:20px;">FLAG FOR REVIEW: Gimbal ring proportions, sensor head size, beam angle representation for off-axis aim.</p>
</body></html>
