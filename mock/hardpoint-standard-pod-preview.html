<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Standard Pod — Preview</title>
<style>
:root { --bg:#06090b; --panel:#0d1418; --border:#1f2e33; --text:#d8e6e8; --dim:#5c7378; --amber:#ffb000; --green:#3ddc71; --red:#ff4d4d; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:ui-monospace,monospace; padding:24px; }
h1 { color:var(--amber); letter-spacing:.22em; font-size:16px; margin-bottom:16px; }
.row { display:flex; gap:24px; flex-wrap:wrap; }
.card { background:var(--panel); border:1px solid var(--border); padding:16px; width:220px; }
.label { color:var(--dim); font-size:11px; letter-spacing:.14em; margin-bottom:8px; }
.fill-bar { height:10px; background:rgba(255,176,0,.12); border:1px solid var(--amber); border-radius:2px; overflow:hidden; margin:8px 0 4px; }
.fill-inner { height:100%; background:var(--amber); opacity:.72; }
.contents { color:var(--dim); font-size:11px; letter-spacing:.14em; margin-top:4px; }
.fill-pct { font-size:42px; font-weight:700; color:var(--text); margin:8px 0 0; }
</style></head><body>
<h1>HARDPOINT MODULE — STANDARD POD</h1>
<p style="color:var(--dim);font-size:11px;letter-spacing:.12em;margin-bottom:20px;">Cargo/Storage category. All soft keys blank. Purely readout.</p>
<div class="row">

<div class="card">
  <div class="label">PARTIALLY FILLED</div>
  <svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" style="width:100%">
    <rect x="10" y="20" width="10" height="30" rx="1" fill="none" stroke="#ffb000" stroke-width="1.2"/>
    <rect x="4"  y="25" width="6"  height="6"  rx="1" fill="none" stroke="#ffb000" stroke-width="0.8"/>
    <rect x="4"  y="37" width="6"  height="6"  rx="1" fill="none" stroke="#ffb000" stroke-width="0.8"/>
    <rect x="20" y="12" width="400" height="46" rx="2" fill="none" stroke="#ffb000" stroke-width="2"/>
    <line x1="120" y1="12" x2="120" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <line x1="220" y1="12" x2="220" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <line x1="320" y1="12" x2="320" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <rect x="80"  y="46" width="50" height="12" rx="1" fill="#06090b" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="260" y="46" width="50" height="12" rx="1" fill="#06090b" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="18" y="10" width="8" height="8" fill="none" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="412" y="10" width="8" height="8" fill="none" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="18" y="52" width="8" height="8" fill="none" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="412" y="52" width="8" height="8" fill="none" stroke="#ffb000" stroke-width="0.9"/>
    <circle cx="22" cy="35" r="4" fill="#ffb000" opacity="0.65"/>
    <text x="260" y="110" text-anchor="middle" fill="#ffb000" font-size="28" font-family="monospace" font-weight="700">62%</text>
    <rect x="60" y="128" width="400" height="12" rx="2" fill="rgba(255,176,0,.12)" stroke="#ffb000" stroke-width="1"/>
    <rect x="60" y="128" width="248" height="12" rx="2" fill="#ffb000" opacity="0.72"/>
    <text x="260" y="165" text-anchor="middle" fill="#5c7378" font-size="11" font-family="monospace" letter-spacing="3">GENERAL CARGO</text>
    <circle cx="30" cy="16" r="5" fill="#3ddc71"/>
  </svg>
  <div class="fill-pct">62%</div>
  <div class="fill-bar"><div class="fill-inner" style="width:62%"></div></div>
  <div class="contents">GENERAL CARGO</div>
</div>

<div class="card">
  <div class="label">FULL</div>
  <svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" style="width:100%">
    <rect x="10" y="20" width="10" height="30" rx="1" fill="none" stroke="#ffb000" stroke-width="1.2"/>
    <rect x="20" y="12" width="400" height="46" rx="2" fill="none" stroke="#ffb000" stroke-width="2"/>
    <line x1="120" y1="12" x2="120" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <line x1="220" y1="12" x2="220" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <line x1="320" y1="12" x2="320" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <rect x="80"  y="46" width="50" height="12" rx="1" fill="#06090b" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="260" y="46" width="50" height="12" rx="1" fill="#06090b" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="18" y="10" width="8" height="8" fill="none" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="412" y="10" width="8" height="8" fill="none" stroke="#ffb000" stroke-width="0.9"/>
    <circle cx="22" cy="35" r="4" fill="#ffb000" opacity="0.65"/>
    <text x="260" y="110" text-anchor="middle" fill="#ffb000" font-size="28" font-family="monospace" font-weight="700">100%</text>
    <rect x="60" y="128" width="400" height="12" rx="2" fill="rgba(255,176,0,.12)" stroke="#ffb000" stroke-width="1"/>
    <rect x="60" y="128" width="400" height="12" rx="2" fill="#ffb000" opacity="0.72"/>
    <text x="260" y="165" text-anchor="middle" fill="#5c7378" font-size="11" font-family="monospace" letter-spacing="3">GENERAL CARGO</text>
    <circle cx="30" cy="16" r="5" fill="#3ddc71"/>
  </svg>
  <div class="fill-pct">100%</div>
  <div class="fill-bar"><div class="fill-inner" style="width:100%"></div></div>
  <div class="contents">GENERAL CARGO</div>
</div>

<div class="card">
  <div class="label">EMPTY / UNARMED</div>
  <svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" style="width:100%">
    <rect x="10" y="20" width="10" height="30" rx="1" fill="none" stroke="#ffb000" stroke-width="1.2"/>
    <rect x="20" y="12" width="400" height="46" rx="2" fill="none" stroke="#ffb000" stroke-width="2"/>
    <line x1="120" y1="12" x2="120" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <line x1="220" y1="12" x2="220" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <line x1="320" y1="12" x2="320" y2="58" stroke="#ffb000" stroke-width="0.8" opacity="0.35"/>
    <rect x="80"  y="46" width="50" height="12" rx="1" fill="#06090b" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="260" y="46" width="50" height="12" rx="1" fill="#06090b" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="18" y="10" width="8" height="8" fill="none" stroke="#ffb000" stroke-width="0.9"/>
    <rect x="412" y="10" width="8" height="8" fill="none" stroke="#ffb000" stroke-width="0.9"/>
    <circle cx="22" cy="35" r="4" fill="#ffb000" opacity="0.3"/>
    <text x="260" y="110" text-anchor="middle" fill="#5c7378" font-size="28" font-family="monospace" font-weight="700">0%</text>
    <rect x="60" y="128" width="400" height="12" rx="2" fill="rgba(255,176,0,.12)" stroke="#ffb000" stroke-width="1"/>
    <text x="260" y="165" text-anchor="middle" fill="#5c7378" font-size="11" font-family="monospace" letter-spacing="3">EMPTY</text>
    <circle cx="30" cy="16" r="5" fill="#ff4d4d"/>
  </svg>
  <div class="fill-pct" style="color:var(--dim)">0%</div>
  <div class="fill-bar"><div class="fill-inner" style="width:0%"></div></div>
  <div class="contents">EMPTY</div>
</div>

</div>
<p style="color:var(--dim);font-size:10px;letter-spacing:.12em;margin-top:20px;">FLAG FOR REVIEW: Container proportions, forklift channel size, status light placement.</p>
</body></html>
